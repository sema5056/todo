<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ToDo</title>
  <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background: linear-gradient(135deg, #6a5acd, #00c6ff);
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }
    .container{
      background:white;
      padding:30px;
      border-redius:20px;
      width:400px;
      box-shadow:0 10px 30px rgba(0,0,0,0.2);
    }
    h1{
      text-align:center;
      margin-bottom:20px;
      color:#6a5acd;
    }
    .input-area{
      display:flex;
      gap:10px;
    }
    #taskInput{
      flex:1;
      padding:10px;
      border-radius:10px;
      border:1px solid #ccc;
    }
    button{
      padding:10px 15px;
      border:none;
      border-radius:10px;
      background:#6a5acd;
      color:white;
      cursor:pointer;
      transition:0.3s;
    }
    button:hover{
      background:#483d8b;
    }
    .filters{
      margin-yop:15px;
      display:flex;
      justify-content:space-between;
    }
    ul{
      list-style:none;
      padding:0;
      margin-top:15px;
    }
    li{
      display:flex;
      align-items:center;
      justify-content:space-between;
      background:#f3f3ff;
      padding:10px;
      border-radius:10px;
      margin-bottom:10px;
    }
    li span{
      flex:1;
      margin-left:10px;
    }
    li button{
      background:transparent;
      color:red;
      font-size:16px;
    }
    .bottom{
      margin-top:15px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }
    .clear-btn{
      background:#ff4d6d;
    }
    .clear-btn:hover{
      background:#c9184a;
    }
    #counter{
      font-size:14px;
      color:#555;
    }
  </style>
</head>
<body>
<div class="container">
  <h2>My ToDo List</h2>
  <div class="input-area">
    <input id="taskInput" type="text" placeholder="Write task...">
    <button onclick="addTask()">Add</button>
  </div>
  <div class="filters">
    <button onclick="filterTasks('all')">All</button>
    <button onclick="filterTasks('active')">Active</button>
    <button onclick="filterTasks('done')">Done</button>
  </div>

  <ul id="taskList"></ul>
  <div class="bottom">
    <button onclick="clearDone()">Clear done</button>
    <p id="counter">Active tasks: 0</p>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
